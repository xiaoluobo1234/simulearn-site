services:
  simulearn_book_worker:
    build:
      context: .
    container_name: simulearn-book-worker
    restart: unless-stopped
    env_file:
      - .env.books
    networks:
      - dify
    mem_limit: 768m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777

networks:
  dify:
    external: true
    name: docker_default
